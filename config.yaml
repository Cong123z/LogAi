# LogAI Engine configuration: only values that differ from the defaults in
# logai/config.py (every setting, its default and its meaning live there).
# Any key from those dataclasses can be added here to override it.
# Environment variables override this file; see .env.example.

elasticsearch:
  hosts:
    - "http://elasticsearch:9200"
  # Indices are chosen on the web "Data sources" page; `index` only seeds the
  # selection until the first save there.
  index: "recharge-logs"
  batch_size: 2000

anomaly:
  predict_batch_size: 2000

alert:
  warm_consecutive: 10
  alert_consecutive: 30
  cool_consecutive: 10
  score_high: 0.65
  score_low: 0.52
  min_events_1m: 150

training:
  max_docs: 500000
