# LogAI Engine configuration.
# Any value here can be overridden at runtime; ES credentials are best set
# via environment variables instead (see logai/config.py):
#   LOGAI_ES_HOSTS, LOGAI_ES_USER, LOGAI_ES_PASSWORD,
#   LOGAI_METRICS_PORT, LOGAI_METRICS_HOST,
#   LOGAI_STORAGE_BASE_DIR,
#   LOGAI_WEB_PORT, LOGAI_WEB_HOST, LOGAI_WEB_DATA_DIR
# See .env.example for the full list of supported variables.

elasticsearch:
  hosts:
    - "http://elasticsearch:9200"
  index: "hdfs-logs"
  poll_interval_seconds: 1
  batch_size: 2000
  request_timeout_seconds: 30

drain3:
  persistence_path: "data/drain3_state.bin"
  sim_threshold: 0.6
  depth: 4
  max_children: 100
  # Wording-only normalisation before Drain3: removes the date/time/LEVEL/
  # [thread] prefix (level searched in the first N tokens) and every
  # timestamp, masks ids/numbers as <*>, keeps words. See
  # logai/parsing/preprocessor.py.
  preprocess: true
  max_chars: 8192
  max_tokens: 40
  level_search_tokens: 5
  # Optional extra Drain3 masking rules applied after preprocessing.
  masking_rules: []

embedding:
  model_name: "BAAI/bge-m3"
  # Required in production through LOGAI_EMBEDDING_ENDPOINT.
  endpoint: ""
  # Supported remote response formats: openai or tei.
  api_format: "openai"
  dimension: 1024
  batch_size: 64
  timeout_seconds: 60
  max_retries: 3
  retry_backoff_seconds: 0.5

clustering:
  # Conservative grouping: only form/accept groups with strong local support.
  min_cluster_size: 4
  min_samples: 2
  metric: "euclidean"
  assignment_similarity_threshold: 0.88

doc_matcher:
  corpus_path: "data/documentation_corpus.json"
  seed_corpus_path: "docs/documentation_corpus.yaml"
  overrides_path: "data/documentation_overrides.json"
  status_path: "data/documentation_status.json"
  similarity_threshold: 0.75
  refresh_interval_seconds: 5

features:
  windows_seconds: [10, 60, 300]
  # Baseline = closed 10s and 1m buckets over this span (time-based, not per event).
  baseline_seconds: 1800
  history_retention_seconds: 3600
  rate_floor: 0.2

anomaly:
  contamination: 0.05
  n_estimators: 100
  random_state: 42
  min_training_samples: 30
  score_alert_threshold: 0.6
  predict_batch_size: 2000
  predict_max_wait_seconds: 1.0

alert:
  warm_consecutive: 10
  alert_consecutive: 30
  cool_consecutive: 10
  score_high: 0.65
  score_low: 0.52
  min_events_1m: 150

training:
  batch_size: 2000
  max_docs: 200000
  lookback_seconds: 604800
  dedup_buffer_size: 10000

storage:
  base_dir: "data"
  template_registry_file: "template_registry.json"
  template_embeddings_file: "template_embeddings.pkl"
  group_registry_file: "group_registry.json"
  group_centroids_file: "group_centroids.pkl"
  checkpoint_file: "checkpoint.json"
  training_checkpoint_file: "training_checkpoint.json"
  training_event_index_file: "training_event_index.jsonl"
  window_state_file: "window_state.json"
  anomaly_state_file: "anomaly_state.json"
  dedup_index_file: "dedup_index.json"
  dlq_file: "dlq.jsonl"
  model_dir: "data/models"
  doc_embeddings_file: "doc_embeddings.pkl"
  grouping_overrides_file: "grouping_overrides.json"
  grouping_status_file: "grouping_status.json"

grouping:
  heartbeat_interval_seconds: 5
  engine_status_stale_seconds: 45

reliability:
  max_retries: 5
  backoff_base_seconds: 1
  backoff_max_seconds: 60
  dedup_ttl_seconds: 86400
  dedup_max_size: 200000
  dedup_flush_interval_seconds: 30

metrics:
  http_port: 9108
  http_host: "0.0.0.0"
