# Deploy LogAI engine ALONGSIDE an already-running stack (Elasticsearch +
# Prometheus + log generator) that lives on the external `aiops-net` network.
#
# This file does NOT start its own Elasticsearch or Prometheus — it reuses the
# ones already running. It only builds/runs the LogAI engine and (optionally)
# Grafana, attaching them to `aiops-net` so `http://elasticsearch:9200` and the
# `logai-engine` hostname resolve across the shared network.
#
# Usage:
#   1) Build once:      docker compose -f docker-compose.yml build
#   2) Train (one-off): docker compose -f docker-compose.yml run --rm logai-training
#        custom range:  docker compose -f docker-compose.yml run --rm logai-training \
#                           python scripts/run_training.py --lookback-hours 48
#   3) Realtime:        docker compose -f docker-compose.yml up -d logai-engine
#   4) Grafana (opt):   docker compose -f docker-compose.yml --profile ui up -d grafana
#
# Named volumes use explicit `name:` so they match the bare volumes created by
# any `docker run -v logai-data ...` commands (no project-name prefixing) — the
# training job and the realtime service therefore share the same data + model.
name: logai

# Env shared by the realtime engine and the training job.
x-logai-env: &logai-env
  LOGAI_ES_HOSTS: ${LOGAI_ES_HOSTS:-http://elasticsearch:9200}
  LOGAI_ES_INDEX: ${LOGAI_ES_INDEX:-app-logs-*}
  LOGAI_ES_USER: ${LOGAI_ES_USER:-}
  LOGAI_ES_PASSWORD: ${LOGAI_ES_PASSWORD:-}
  LOGAI_STORAGE_BASE_DIR: ${LOGAI_STORAGE_BASE_DIR:-/app/data}
  LOGAI_DOCUMENTATION_CORPUS_PATH: ${LOGAI_DOCUMENTATION_CORPUS_PATH:-/app/data/documentation_corpus.json}
  LOGAI_EMBEDDING_ENDPOINT: ${LOGAI_EMBEDDING_ENDPOINT:-}
  LOGAI_EMBEDDING_API_FORMAT: ${LOGAI_EMBEDDING_API_FORMAT:-openai}
  LOGAI_EMBEDDING_API_KEY: ${LOGAI_EMBEDDING_API_KEY:-}
  LOGAI_EMBEDDING_MODEL: ${LOGAI_EMBEDDING_MODEL:-BAAI/bge-m3}
  LOGAI_EMBEDDING_DIMENSION: ${LOGAI_EMBEDDING_DIMENSION:-1024}
  LOGAI_EMBEDDING_BATCH_SIZE: ${LOGAI_EMBEDDING_BATCH_SIZE:-64}
  LOGAI_EMBEDDING_TIMEOUT_SECONDS: ${LOGAI_EMBEDDING_TIMEOUT_SECONDS:-60}
  LOGAI_EMBEDDING_MAX_RETRIES: ${LOGAI_EMBEDDING_MAX_RETRIES:-3}

services:
  # ── Realtime pipeline (long-running; default `up` target) ───────────────
  logai-engine:
    build: .
    image: logai-engine
    container_name: logai-engine
    environment:
      <<: *logai-env
      LOGAI_METRICS_PORT: ${LOGAI_METRICS_PORT:-9108}
      LOGAI_METRICS_HOST: ${LOGAI_METRICS_HOST:-0.0.0.0}
      LOGAI_LLM_ENDPOINT: ${LOGAI_LLM_ENDPOINT:-}
      LOGAI_LLM_API_KEY: ${LOGAI_LLM_API_KEY:-}
      LOGAI_LLM_MODEL: ${LOGAI_LLM_MODEL:-}
    ports:
      - "${LOGAI_METRICS_PORT:-9108}:${LOGAI_METRICS_PORT:-9108}"
    volumes:
      - logai-data:/app/data
    networks:
      - aiops-net
    depends_on:
      - logai-web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Training (one-off job; NOT started by `up`, only via `run`) ─────────
  logai-training:
    build: .
    image: logai-engine
    profiles: ["training"]
    environment: *logai-env
    volumes:
      - logai-data:/app/data
    networks:
      - aiops-net
    command: ["python", "scripts/run_training.py", "--lookback-hours", "24"]

  # ── Template Explorer Web UI (started automatically with logai-engine) ──
  logai-web:
    build: .
    image: logai-engine
    container_name: logai-web
    ports:
      - "${LOGAI_WEB_PORT:-5555}:${LOGAI_WEB_PORT:-5555}"
    volumes:
      # The web process writes only documentation and grouping intent files.
      - logai-data:/app/data
    networks:
      - aiops-net
    environment:
      - LOGAI_WEB_PORT=${LOGAI_WEB_PORT:-5555}
      - LOGAI_WEB_HOST=${LOGAI_WEB_HOST:-0.0.0.0}
      - LOGAI_STORAGE_BASE_DIR=${LOGAI_STORAGE_BASE_DIR:-/app/data}
      - LOGAI_DOCUMENTATION_CORPUS_PATH=${LOGAI_DOCUMENTATION_CORPUS_PATH:-/app/data/documentation_corpus.json}
    command: ["python", "scripts/run_web.py"]

  # ── Grafana (optional; only with `--profile ui`) ────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["ui"]
    container_name: logai-grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - aiops-net

networks:
  aiops-net:
    name: ${LOGAI_NETWORK:-aiops-net}
    external: true

volumes:
  logai-data:
    name: logai-data
  grafana-data:
    name: logai-grafana-data
