version: "3.8"

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Your own log-generator app should write documents into `app-logs-*`
  # indices in Elasticsearch, e.g.:
  #   POST /app-logs-2026.09.07/_doc
  #   { "@timestamp": "...", "service": "payment", "level": "ERROR",
  #     "message": "DB connection timeout host=10.0.0.1" }

  logai-engine:
    build: .
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - LOGAI_ES_HOSTS=http://elasticsearch:9200
      - LOGAI_METRICS_PORT=9108
    ports:
      - "9108:9108"
    volumes:
      - logai-data:/app/data
      - hf-cache:/root/.cache/huggingface   # persist downloaded embedding model (~90MB)
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    depends_on:
      - logai-engine
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

volumes:
  es-data:
  logai-data:
  hf-cache:
  prom-data:
  grafana-data:
