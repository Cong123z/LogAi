name: CI/CD

# PR into master  -> test, validate, build + scan the arm64 image (nothing is published)
# Push to master  -> the same, then publish to GHCR and point the Oracle overlay at the new tag;
#                    Argo CD in the cluster picks up that commit and deploys it.
on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Lowercase GHCR path; must match newName in k8s/overlays/oracle/kustomization.yaml.
  IMAGE_NAME: ghcr.io/cong123z/logai

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: logai
          POSTGRES_PASSWORD: logai
          POSTGRES_DB: logai_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U logai -d logai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      LOGAI2_TEST_DSN: postgresql://logai:logai@localhost:5433/logai_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -q

  validate:
    name: Validate Compose and Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config -q

      - name: Render Kustomize overlays
        run: |
          kubectl kustomize k8s/overlays/oracle > /dev/null
          cp k8s/overlays/local/.env.example k8s/overlays/local/.env
          kubectl kustomize k8s/overlays/local > /dev/null

  image:
    name: Build, scan and publish arm64 image
    needs: [test, validate]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image (local)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: logai2-engine:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: docker run --rm logai2-engine:ci python -c "import logai2; print('import ok')"

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: logai2-engine:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  deploy:
    name: Point the Oracle overlay at the new image
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      OVERLAY: k8s/overlays/oracle/kustomization.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0

      - name: Set newTag to this commit
        id: bump
        run: |
          current=$(sed -nE 's/^[[:space:]]*newTag:[[:space:]]*sha-([0-9a-f]{40}).*$/\1/p' "$OVERLAY")
          if [ -n "$current" ] && [ "$current" != "$GITHUB_SHA" ] \
             && git merge-base --is-ancestor "$GITHUB_SHA" "$current"; then
            echo "A newer commit ($current) is already deployed; skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sed -i -E "s/^([[:space:]]*newTag:).*/\1 sha-${GITHUB_SHA}/" "$OVERLAY"
          grep -q "newTag: sha-${GITHUB_SHA}" "$OVERLAY"
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(oracle): logai sha-${GITHUB_SHA::7} [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep 5
          done
          exit 1
