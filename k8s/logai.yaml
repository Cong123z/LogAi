# LogAI realtime engine, web UI, and services.
# Apply k8s/training.yaml first and wait for the training Job to complete.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: logai
  labels:
    app: logai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: logai
  template:
    metadata:
      labels:
        app: logai
    spec:
      volumes:
        - name: logai-data
          persistentVolumeClaim:
            claimName: logai-data-pvc
      containers:
        - name: logai-engine
          image: congdock123/logai-engine:latest
          imagePullPolicy: Always
          command: ["python", "scripts/run_realtime.py"]
          envFrom:
            - secretRef:
                name: logai-env
            - configMapRef:
                name: logai-embedding
          ports:
            - name: metrics
              containerPort: 9108
              protocol: TCP
          volumeMounts:
            - name: logai-data
              mountPath: /app/data
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          readinessProbe:
            exec:
              command: ["python", "scripts/healthcheck.py"]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 20
        - name: logai-web
          image: congdock123/logai-engine:latest
          imagePullPolicy: Always
          command: ["python", "scripts/run_web.py"]
          envFrom:
            - secretRef:
                name: logai-env
          ports:
            - name: web
              containerPort: 5555
              protocol: TCP
          volumeMounts:
            - name: logai-data
              mountPath: /app/data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: web
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/stats
              port: web
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: logai-web
spec:
  selector:
    app: logai
  ports:
    - name: http-web
      port: 5555
      targetPort: web
---
apiVersion: v1
kind: Service
metadata:
  name: logai-metrics
spec:
  selector:
    app: logai
  ports:
    - name: metrics
      port: 9108
      targetPort: metrics
