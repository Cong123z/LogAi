# Replaces each container's envFrom list. Later sources win, so the Secret
# comes last and can override a ConfigMap value if both set the same key.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logai
spec:
  template:
    spec:
      containers:
        - name: logai-engine
          envFrom:
            - configMapRef:
                name: logai-config
            - configMapRef:
                name: logai-embedding
            - secretRef:
                name: logai-env
        - name: logai-web
          envFrom:
            - configMapRef:
                name: logai-config
            - secretRef:
                name: logai-env
