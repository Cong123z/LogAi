apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# GitOps overlay for the Oracle Cloud cluster, rendered by Argo CD
# (see k8s/argocd/logai-application.yaml).
#
# This cluster runs the engine and the web UI as two Deployments that share a
# ReadWriteMany volume, so this overlay does not use ../../base (one Pod with
# both containers). Names, selectors and the PVC match the objects already
# running, so Argo CD adopts them instead of creating new ones.
#
# Not managed here (created by hand, never in Git):
#   Secret logai-env            credentials
#   ConfigMap logai-embedding   BGE-M3 endpoint
#   PersistentVolume logai-data-pv  hostPath /u01/logai (cluster-scoped)
namespace: logai

resources:
  - pvc.yaml
  - engine.yaml
  - web.yaml

configMapGenerator:
  - name: logai-config
    envs:
      - params.env

# The CI workflow rewrites newTag to sha-<commit> after each image it publishes
# on master. Argo CD sees that commit and rolls both Deployments.
images:
  - name: logai-engine
    newName: ghcr.io/cong123z/logai
    newTag: sha-e33310e73a1882d3b7b56380b28d7d4f16b8ec0a
