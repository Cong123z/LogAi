# logai2 linker: embeds templates and documents (bge-m3), keeps automatic document links current,
# and runs the LLM resolver (profiles and API keys are set on the web's LLM profiles page, not here).
# Waits on its own until the engine has created the schema. One replica: two would double LLM calls.
# Secret logai-env and ConfigMap logai-embedding come from logai-engine.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logai-linker
  labels:
    app.kubernetes.io/name: logai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: logai-linker
  template:
    metadata:
      labels:
        app: logai-linker
        app.kubernetes.io/name: logai
    spec:
      enableServiceLinks: false
      containers:
        - name: logai-linker
          image: congdock123/logai2:v1
          imagePullPolicy: Always
          command: ["python", "scripts/run_linker.py"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: logai-env, key: POSTGRES_PASSWORD}}
            - name: LOGAI2_DATABASE_DSN
              value: "postgresql://logai:$(POSTGRES_PASSWORD)@logai-postgres:5432/logai"
            - name: LOGAI2_EMBEDDING_URL
              valueFrom: {configMapKeyRef: {name: logai-embedding, key: LOGAI_EMBEDDING_URL}}
            - name: LOGAI2_EMBEDDING_MODEL   # the model name the server or gateway expects
              valueFrom: {configMapKeyRef: {name: logai-embedding, key: LOGAI_EMBEDDING_MODEL, optional: true}}
            - name: LOGAI2_EMBEDDING_API_KEY   # only when a gateway in front of bge-m3 needs a key
              valueFrom: {secretKeyRef: {name: logai-env, key: LOGAI_EMBEDDING_API_KEY, optional: true}}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
