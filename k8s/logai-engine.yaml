# logai2 engine: reads Elasticsearch, templates, counts, detects, writes Postgres; metrics on 9108.
# This file holds the shared Secret and ConfigMap; logai-web.yaml and logai-linker.yaml only reference them.
# logai2 reads LOGAI2_* variables: each Deployment maps these LOGAI_* keys to them under `env`.
# No volume: all state is in Postgres (logai-postgres.yaml). Exactly one engine per database.
apiVersion: v1
kind: Secret
metadata:
  name: logai-env
type: Opaque
stringData:
  LOGAI_ES_HOSTS: "http://elasticsearch.logging.svc:9200"
  LOGAI_ES_INDEX: "hdfs"
  LOGAI_ES_USER: "elastic"
  LOGAI_ES_PASSWORD: "password"
  LOGAI_ES_VERIFY_CERTS: "true"
  # Postgres password, also used in the DSN below: letters and digits only (it goes into a URL)
  POSTGRES_PASSWORD: "congdo123"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: logai-embedding
data:
  # base URL only: logai2 adds /v1/embeddings itself
  LOGAI_EMBEDDING_URL: "http://bge-m3.embedding.svc.cluster.local:8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logai-engine
  labels:
    app.kubernetes.io/name: logai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: logai-engine
  template:
    metadata:
      labels:
        app: logai-engine
        app.kubernetes.io/name: logai
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9108"
        prometheus.io/path: "/metrics"
    spec:
      enableServiceLinks: false
      containers:
        - name: logai-engine
          image: congdock123/logai2:v1
          imagePullPolicy: Always
          command: ["python", "scripts/run_engine.py"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: logai-env, key: POSTGRES_PASSWORD}}
            - name: LOGAI2_DATABASE_DSN
              value: "postgresql://logai:$(POSTGRES_PASSWORD)@logai-postgres:5432/logai"
            - name: LOGAI2_ES_HOSTS
              valueFrom: {secretKeyRef: {name: logai-env, key: LOGAI_ES_HOSTS}}
            - name: LOGAI2_ES_INDEX
              valueFrom: {secretKeyRef: {name: logai-env, key: LOGAI_ES_INDEX}}
            - name: LOGAI2_ES_USER
              valueFrom: {secretKeyRef: {name: logai-env, key: LOGAI_ES_USER}}
            - name: LOGAI2_ES_PASSWORD
              valueFrom: {secretKeyRef: {name: logai-env, key: LOGAI_ES_PASSWORD}}
            - name: LOGAI2_ES_VERIFY_CERTS
              valueFrom: {secretKeyRef: {name: logai-env, key: LOGAI_ES_VERIFY_CERTS}}
          ports:
            - name: metrics
              containerPort: 9108
              protocol: TCP
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          # the process exits while Postgres is unreachable and is restarted; the metrics port opens once connected
          startupProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: logai-metrics-svc
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9108"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: logai-engine
  ports:
    - name: metrics
      port: 9108
      targetPort: metrics
      protocol: TCP
