apiVersion: apps/v1
kind: Deployment
metadata:
  name: logai-engine
  labels:
    app.kubernetes.io/name: logai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: logai-engine
  template:
    metadata:
      labels:
        app: logai-engine
        app.kubernetes.io/name: logai
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9108"
        prometheus.io/path: "/metrics"
    spec:
      enableServiceLinks: false
      containers:
        - name: logai-engine
          image: logai2-engine
          imagePullPolicy: IfNotPresent
          command: ["python", "scripts/run_engine.py"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: logai-env
                  key: POSTGRES_PASSWORD
            - name: LOGAI2_DATABASE_DSN
              value: "postgresql://logai:$(POSTGRES_PASSWORD)@logai-postgres:5432/logai"
            - name: LOGAI2_ES_HOSTS
              valueFrom:
                secretKeyRef:
                  name: logai-env
                  key: LOGAI_ES_HOSTS
                  optional: true
            - name: LOGAI2_ES_INDEX
              valueFrom:
                secretKeyRef:
                  name: logai-env
                  key: LOGAI_ES_INDEX
                  optional: true
            - name: LOGAI2_ES_USER
              valueFrom:
                secretKeyRef:
                  name: logai-env
                  key: LOGAI_ES_USER
                  optional: true
            - name: LOGAI2_ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: logai-env
                  key: LOGAI_ES_PASSWORD
                  optional: true
            - name: LOGAI2_ES_VERIFY_CERTS
              valueFrom:
                secretKeyRef:
                  name: logai-env
                  key: LOGAI_ES_VERIFY_CERTS
                  optional: true
          ports:
            - name: metrics
              containerPort: 9108
              protocol: TCP
          resources:
            requests:
              cpu: 150m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          startupProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: logai-metrics-svc
  labels:
    app.kubernetes.io/name: logai
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9108"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: logai-engine
  ports:
    - name: metrics
      port: 9108
      targetPort: metrics
      protocol: TCP
