apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: logai-pg-pvc
  labels:
    app.kubernetes.io/name: logai
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: logai-pg-storage
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: logai-postgres
  labels:
    app.kubernetes.io/name: logai
spec:
  serviceName: logai-postgres
  replicas: 1
  selector:
    matchLabels:
      app: logai-postgres
  template:
    metadata:
      labels:
        app: logai-postgres
        app.kubernetes.io/name: logai
    spec:
      enableServiceLinks: false
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: logai-pg-pvc
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: logai
            - name: POSTGRES_DB
              value: logai
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: logai-env
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "logai", "-d", "logai"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "logai", "-d", "logai"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: logai-postgres
  labels:
    app.kubernetes.io/name: logai
spec:
  type: ClusterIP
  selector:
    app: logai-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
