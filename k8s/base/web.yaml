apiVersion: apps/v1
kind: Deployment
metadata:
  name: logai-web
  labels:
    app.kubernetes.io/name: logai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: logai-web
  template:
    metadata:
      labels:
        app: logai-web
        app.kubernetes.io/name: logai
    spec:
      enableServiceLinks: false
      containers:
        - name: logai-web
          image: logai2-engine
          imagePullPolicy: IfNotPresent
          command: ["python", "scripts/run_web.py"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: logai-env
                  key: POSTGRES_PASSWORD
            - name: LOGAI2_DATABASE_DSN
              value: "postgresql://logai:$(POSTGRES_PASSWORD)@logai-postgres:5432/logai"
            - name: LOGAI2_ES_HOSTS
              valueFrom:
                secretKeyRef:
                  name: logai-env
                  key: LOGAI_ES_HOSTS
                  optional: true
            - name: LOGAI2_ES_INDEX
              valueFrom:
                secretKeyRef:
                  name: logai-env
                  key: LOGAI_ES_INDEX
                  optional: true
            - name: LOGAI2_ES_USER
              valueFrom:
                secretKeyRef:
                  name: logai-env
                  key: LOGAI_ES_USER
                  optional: true
            - name: LOGAI2_ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: logai-env
                  key: LOGAI_ES_PASSWORD
                  optional: true
            - name: LOGAI2_ES_VERIFY_CERTS
              valueFrom:
                secretKeyRef:
                  name: logai-env
                  key: LOGAI_ES_VERIFY_CERTS
                  optional: true
            - name: LOGAI2_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: logai-env
                  key: LOGAI_API_TOKEN
                  optional: true
          ports:
            - name: web
              containerPort: 5555
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: web
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: logai-web
  labels:
    app.kubernetes.io/name: logai
spec:
  type: ClusterIP
  selector:
    app: logai-web
  ports:
    - name: http
      port: 5555
      targetPort: 5555
